<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-body-tertiary border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand text-danger fw-bold" href="/">Work Manager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Заказы</a></li>
                    <li class="nav-item"><a class="nav-link" href="/new">+ Новый</a></li>
                    <li class="nav-item"><a class="nav-link" href="/settings">⚙️ Настройки</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <span id="modeLabel" class="form-text">Ручной</span>
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="autoToggle" {% if auto_mode %}checked{% endif %}>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-3">
        {% block content %}{% endblock %}
    </main>

    {# ── Log Panel ── #}
    <div id="log-panel" class="log-panel collapsed">
        <div class="log-header" onclick="toggleLogPanel()">
            <span id="log-panel-title">📋 Логи</span>
            <span id="log-count" class="badge bg-secondary ms-1"></span>
            <span class="log-toggle ms-auto" id="log-toggle-icon">▲</span>
        </div>
        <div class="log-body" id="log-body">
            <div class="log-toolbar d-flex gap-2 p-1 px-2 border-bottom border-secondary">
                <input type="text" id="log-filter" placeholder="Фильтр..." class="form-control form-control-sm" style="max-width:200px" oninput="filterLogs()">
                <button class="btn btn-sm btn-outline-secondary" onclick="clearLogPanel()">Очистить</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="scrollLogBottom()">⬇</button>
            </div>
            <div class="log-entries" id="log-entries"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Auto-mode toggle
    const toggle = document.getElementById('autoToggle');
    const modeLabel = document.getElementById('modeLabel');
    toggle.addEventListener('change', async () => {
        const url = toggle.checked ? '/api/auto/start' : '/api/auto/stop';
        try {
            await fetch(url, { method: 'POST' });
            modeLabel.textContent = toggle.checked ? 'Авто' : 'Ручной';
        } catch (e) {
            toggle.checked = !toggle.checked;
        }
    });
    if (toggle.checked) modeLabel.textContent = 'Авто';

    // ── Log Panel ──────────────────────────────────────────────
    let _logEs = null;
    let _logAll = [];
    const _MAX_LOGS = 500;

    function toggleLogPanel() {
        const panel = document.getElementById('log-panel');
        panel.classList.toggle('collapsed');
        if (!panel.classList.contains('collapsed')) scrollLogBottom();
    }

    function scrollLogBottom() {
        const el = document.getElementById('log-entries');
        el.scrollTop = el.scrollHeight;
    }

    function clearLogPanel() {
        _logAll = [];
        renderLogs();
    }

    function filterLogs() {
        renderLogs();
    }

    const _LEVEL_COLORS = {
        'DEBUG': '#6c757d', 'INFO': '#198754', 'WARNING': '#ffc107', 'ERROR': '#dc3545', 'CRITICAL': '#ff2040'
    };

    function addLogEntry(entry) {
        _logAll.push(entry);
        if (_logAll.length > _MAX_LOGS) _logAll.shift();
        const count = document.getElementById('log-count');
        const n = _logAll.length;
        count.textContent = n > 0 ? n : '';
        renderLogs(true);
    }

    function renderLogs(append = false) {
        const el = document.getElementById('log-entries');
        const filter = (document.getElementById('log-filter')?.value || '').toLowerCase();
        const filtered = filter ? _logAll.filter(e => e.message.toLowerCase().includes(filter) || e.logger.toLowerCase().includes(filter)) : _logAll;

        if (append && !filter) {
            const entry = _logAll[_logAll.length - 1];
            const div = document.createElement('div');
            div.className = 'log-entry';
            const color = _LEVEL_COLORS[entry.level] || '#6c757d';
            div.innerHTML = `<span class="log-time">${esc(entry.time)}</span><span class="log-level" style="color:${color}">${esc(entry.level)}</span><span class="log-logger">${esc(entry.logger.split('.').pop())}</span><span class="log-msg">${esc(entry.message)}</span>`;
            el.appendChild(div);
            while (el.children.length > _MAX_LOGS) el.removeChild(el.firstChild);
            scrollLogBottom();
            return;
        }

        el.innerHTML = '';
        for (const entry of filtered) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            const color = _LEVEL_COLORS[entry.level] || '#6c757d';
            div.innerHTML = `<span class="log-time">${esc(entry.time)}</span><span class="log-level" style="color:${color}">${esc(entry.level)}</span><span class="log-logger">${esc(entry.logger.split('.').pop())}</span><span class="log-msg">${esc(entry.message)}</span>`;
            el.appendChild(div);
        }
        scrollLogBottom();
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

    function startLogStream() {
        if (_logEs) return;
        try {
            _logEs = new EventSource('/api/logs/stream');
            _logEs.onmessage = (event) => {
                try {
                    const entry = JSON.parse(event.data);
                    addLogEntry(entry);
                } catch {}
            };
            _logEs.onerror = () => {
                _logEs.close();
                _logEs = null;
                setTimeout(startLogStream, 5000);
            };
        } catch {}
    }

    startLogStream();

    // ── Native Notifications ──────────────────────────────────
    let _notifPermission = Notification.permission;

    function requestNotifPermission() {
        if (!('Notification' in window)) return;
        if (_notifPermission === 'default') {
            Notification.requestPermission().then(p => { _notifPermission = p; });
        }
    }

    document.addEventListener('click', requestNotifPermission, { once: true });

    function sendNotif(title, body) {
        if (_notifPermission !== 'granted') return;
        try { new Notification(title, { body: body }); } catch {}
    }

    if (_logEs) {
        _logEs.addEventListener('message', (event) => {
            try {
                const entry = JSON.parse(event.data);
                const msg = (entry.message || '').toLowerCase();
                if (msg.includes('pending') || msg.includes('на модерации') || msg.includes('создан заказ')) {
                    const code = msg.match(/([А-ЯA-Z]{1,5}-?\d{3,5}(?:\/[А-ЯA-Z0-9]+|[А-ЯA-Z]\d?)*)/);
                    sendNotif('Новый заказ', code ? code[0] : entry.message.slice(0, 80));
                }
            } catch {}
        });
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
