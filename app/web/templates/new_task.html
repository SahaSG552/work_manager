{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-3">Новый заказ</h1>

<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <form id="orderForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="text" class="form-label">Сообщение с заказом</label>
                <textarea id="text" name="text" rows="5" class="form-control" placeholder="Вставьте текст заказа, например: Заказ ЧМ-1102, столешка + стеновая..."></textarea>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-sm-4">
                    <label for="client" class="form-label">Заказчик</label>
                    <select id="client" name="client" class="form-select">
                        <option value="">Авто</option>
                    </select>
                </div>
                <div class="col-sm-4">
                    <label for="source" class="form-label">Источник</label>
                    <select id="source" name="source" class="form-select">
                        <option value="manual">Вручную</option>
                        <option value="telegram">Telegram</option>
                        <option value="email">Email</option>
                        <option value="yougile">Югил</option>
                    </select>
                </div>
                <div class="col-sm-4">
                    <label for="files" class="form-label">Вложения (фото, PDF, DWG)</label>
                    <input type="file" id="files" name="files" multiple accept="image/*,.pdf,.dwg,.dxf" class="form-control">
                </div>
            </div>

            <div class="d-flex gap-2 mb-3">
                <button type="button" id="previewBtn" class="btn btn-outline-light">Предпросмотр</button>
                <button type="submit" class="btn btn-primary">Создать заказ</button>
            </div>
        </form>

        <div id="preview" class="card mb-3" style="display:none;">
            <div class="card-header">Предпросмотр парсинга</div>
            <div class="card-body" id="previewContent"></div>
        </div>

        <div id="result" class="card mb-3" style="display:none;">
            <div class="card-header">Результат</div>
            <div class="card-body" id="resultContent"></div>
        </div>
    </div>
</div>

<script>
const form = document.getElementById('orderForm');
const previewBtn = document.getElementById('previewBtn');
const previewDiv = document.getElementById('preview');
const previewContent = document.getElementById('previewContent');
const resultDiv = document.getElementById('result');
const resultContent = document.getElementById('resultContent');

// Load clients dropdown
(async function loadClients() {
    try {
        const r = await fetch('/api/clients/list');
        const clients = await r.json();
        const sel = document.getElementById('client');
        for (const c of clients) {
            const opt = document.createElement('option');
            opt.value = c.code;
            opt.textContent = c.display_name || c.code;
            sel.appendChild(opt);
        }
    } catch (e) { console.error('Failed to load clients:', e); }
})();

previewBtn.addEventListener('click', async () => {
    const text = document.getElementById('text').value;
    if (!text.trim()) return alert('Введите текст');

    const formData = new FormData();
    formData.append('text', text);

    try {
        const resp = await fetch('/api/parse', { method: 'POST', body: formData });
        const data = await resp.json();
        // If client selected, override owner
        const clientCode = document.getElementById('client').value;
        if (clientCode && data.owner !== clientCode) data.owner = clientCode;
        previewDiv.style.display = 'block';
        let tagsHtml = '';
        if (data.auto_tags && data.auto_tags.length) {
            tagsHtml = '<div>' + data.auto_tags.map(t => '<span class="badge bg-primary bg-opacity-25 me-1">' + t + '</span>').join('') + '</div>';
        }
        previewContent.innerHTML = `
            <table class="table table-sm mb-0">
                <tr><td class="text-body-secondary">Код заказа</td><td>${data.order_code}</td></tr>
                <tr><td class="text-body-secondary">Заказчик</td><td>${data.owner}</td></tr>
                <tr><td class="text-body-secondary">Описание</td><td>${data.description}</td></tr>
                <tr><td class="text-body-secondary">Толщина</td><td>${data.thickness || '—'}</td></tr>
                <tr><td class="text-body-secondary">Мойка</td><td>${data.sink_type || '—'}</td></tr>
                <tr><td class="text-body-secondary">Кромка</td><td>${data.edge_type || '—'}</td></tr>
                <tr><td class="text-body-secondary">Кол-во камня</td><td>${data.stone_amount || '—'}</td></tr>
                <tr><td class="text-body-secondary">Срочность</td><td>${data.urgency || '—'}</td></tr>
                <tr><td class="text-body-secondary">Данные на почте</td><td>${data.email_reference ? 'Да' : 'Нет'}</td></tr>
                <tr><td class="text-body-secondary">Теги</td><td>${tagsHtml || '—'}</td></tr>
            </table>
        `;
    } catch (e) {
        alert('Ошибка парсинга: ' + e.message);
    }
});

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    // Add owner_override if client selected
    const clientCode = document.getElementById('client').value;
    if (clientCode) formData.append('owner_override', clientCode);

    try {
        const resp = await fetch('/api/process', { method: 'POST', body: formData });
        const data = await resp.json();
        resultDiv.style.display = 'block';

        if (data.error) {
            resultContent.innerHTML = `<div class="alert alert-danger mb-0">${data.error}</div>`;
        } else {
            // data is array of results
            const codes = Array.isArray(data) ? data.map(r => r.order?.order_code).filter(Boolean).join(', ') : '';
            resultContent.innerHTML = `
                <div class="alert alert-success mb-0">
                    ✅ Заказ <strong>${codes || 'создан'}</strong> создан (на модерации)!
                </div>
                <p class="mt-2 mb-0"><a href="/">← Вернуться к списку</a></p>
            `;
            document.getElementById('text').value = '';
        }
    } catch (e) {
        resultDiv.style.display = 'block';
        resultContent.innerHTML = `<div class="alert alert-danger mb-0">Ошибка: ${e.message}</div>`;
    }
});
</script>
{% endblock %}
