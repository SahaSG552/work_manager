{% extends "base.html" %}
{% block content %}
<h1>Новый заказ</h1>

<div class="form-container">
    <form id="orderForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="text">Сообщение с заказом</label>
            <textarea id="text" name="text" rows="6" placeholder="Вставьте текст заказа, например: Заказ ЧМ-1102, столешка + стеновая..."></textarea>
        </div>

        <div class="form-group">
            <label for="source">Источник</label>
            <select id="source" name="source">
                <option value="manual">Вручную</option>
                <option value="telegram">Telegram</option>
                <option value="email">Email</option>
                <option value="yougile">Югил</option>
            </select>
        </div>

        <div class="form-group">
            <label for="files">Вложения (фото, PDF, DWG)</label>
            <input type="file" id="files" name="files" multiple accept="image/*,.pdf,.dwg,.dxf">
        </div>

        <div class="form-actions">
            <button type="button" id="previewBtn" class="btn btn-secondary">Предпросмотр</button>
            <button type="submit" class="btn btn-primary">Создать заказ</button>
        </div>
    </form>

    <div id="preview" class="preview-panel" style="display:none;">
        <h3>Предпросмотр парсинга</h3>
        <div id="previewContent"></div>
    </div>

    <div id="result" class="result-panel" style="display:none;">
        <h3>Результат</h3>
        <div id="resultContent"></div>
    </div>
</div>

<script>
const form = document.getElementById('orderForm');
const previewBtn = document.getElementById('previewBtn');
const previewDiv = document.getElementById('preview');
const previewContent = document.getElementById('previewContent');
const resultDiv = document.getElementById('result');
const resultContent = document.getElementById('resultContent');

previewBtn.addEventListener('click', async () => {
    const text = document.getElementById('text').value;
    if (!text.trim()) return alert('Введите текст');

    const formData = new FormData();
    formData.append('text', text);

    try {
        const resp = await fetch('/api/parse', { method: 'POST', body: formData });
        const data = await resp.json();
        previewDiv.style.display = 'block';
        let tagsHtml = '';
        if (data.auto_tags && data.auto_tags.length) {
            tagsHtml = '<div class="tags">' + data.auto_tags.map(t => '<span class="tag">' + t + '</span>').join('') + '</div>';
        }
        previewContent.innerHTML = `
            <table>
                <tr><td><strong>Код заказа</strong></td><td>${data.order_code}</td></tr>
                <tr><td><strong>Заказчик</strong></td><td>${data.owner}</td></tr>
                <tr><td><strong>Описание</strong></td><td>${data.description}</td></tr>
                <tr><td><strong>Толщина</strong></td><td>${data.thickness || '—'}</td></tr>
                <tr><td><strong>Мойка</strong></td><td>${data.sink_type || '—'}</td></tr>
                <tr><td><strong>Кромка</strong></td><td>${data.edge_type || '—'}</td></tr>
                <tr><td><strong>Кол-во камня</strong></td><td>${data.stone_amount || '—'}</td></tr>
                <tr><td><strong>Срочность</strong></td><td>${data.urgency || '—'}</td></tr>
                <tr><td><strong>Данные на почте</strong></td><td>${data.email_reference ? 'Да' : 'Нет'}</td></tr>
                <tr><td><strong>Теги</strong></td><td>${tagsHtml || '—'}</td></tr>
            </table>
        `;
    } catch (e) {
        alert('Ошибка парсинга: ' + e.message);
    }
});

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);

    try {
        const resp = await fetch('/api/process', { method: 'POST', body: formData });
        const data = await resp.json();
        resultDiv.style.display = 'block';

        if (data.error) {
            resultContent.innerHTML = `<p class="error">${data.error}</p>`;
        } else {
            resultContent.innerHTML = `
                <p class="success">✅ Заказ <strong>${data.order.order_code}</strong> создан (на модерации)!</p>
                <p><a href="/">← Вернуться к списку</a></p>
            `;
            document.getElementById('text').value = '';
        }
    } catch (e) {
        resultDiv.style.display = 'block';
        resultContent.innerHTML = `<p class="error">Ошибка: ${e.message}</p>`;
    }
});
</script>
{% endblock %}
