services:
  work-manager:
    build: .
    container_name: work-manager
    ports:
      - "8090:8090"
    volumes:
      # Obsidian vault
      - E:/Работа/Obsidian Vault/Job:/vault:rw
      # YandexDisk working folder
      - E:/Работа/YandexDisk:/yandexdisk:rw
      # Persist DB
      - wm-db:/app/app/db
      # Persist MAX session
      - max-sessions:/app/max_sessions
    environment:
      - OBSIDIAN_VAULT_PATH=/vault
      - WORKING_BASE_PATH=/yandexdisk
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8090
    restart: unless-stopped

volumes:
  wm-db:
  max-sessions:
